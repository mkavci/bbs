<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{var th=localStorage.getItem("theme");document.documentElement.dataset.theme=th||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}catch(e){}</script>
<title>Ürünler | BBS AUTO</title>
<meta name="description" content="Yedek parça ve ürünlerimizin detay, fiyat ve stok bilgisi.">
<meta name="theme-color" content="#f4f5f7">
<meta property="og:site_name" content="BBS AUTO">
<meta property="og:locale" content="tr_TR">
<meta property="og:image" content="image/bbslogo.png">
<link rel="icon" href="image/bbslogo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
<script>try{var c=localStorage.getItem("bbs_css");if(c){var s=document.createElement("style");s.id="bbs-theme";s.textContent=c;document.head.appendChild(s)}if(sessionStorage.getItem("bbs_splash"))document.documentElement.classList.add("no-splash")}catch(e){}</script>
<noscript><style>#splash{display:none}</style></noscript>
</head>
<body data-page="urunler">
<div id="splash" aria-hidden="true"><div class="sp-in"><img src="image/bbslogo.png" alt=""><i></i></div></div>
<script>try{var l=localStorage.getItem("bbs_logo");if(l)document.querySelector("#splash img").src=l}catch(e){}</script>
<a class="skip" href="#main">İçeriğe geç</a>
<div id="hdr"></div>
<main id="main"><section><div class="wrap">
  <div class="head"><h2>Tüm ürünler</h2><p>Online satış yoktur; fiyat ve stok bilgisi içindir.</p></div>
  <div class="tools">
    <input id="q" type="search" placeholder="Ürün ara" aria-label="Ürün ara">
    <select id="cat" aria-label="Kategori"><option value="">Tüm kategoriler</option></select>
    <select id="stk" aria-label="Stok"><option value="">Tüm stok durumları</option><option value="var">Stokta</option><option value="sinirli">Sınırlı stok</option><option value="yok">Tükendi</option></select>
    <select id="srt" aria-label="Sırala"><option value="yeni">En yeni</option><option value="az">Ada göre</option><option value="ar">Fiyat: düşükten yükseğe</option><option value="az2">Fiyat: yüksekten düşüğe</option></select>
  </div>
  <p class="count"><span id="count" aria-live="polite"></span> <button class="lnk" id="clr" type="button" hidden>Filtreleri temizle</button></p>
  <div class="grid" id="products"></div>
</div></section></main>
<div id="ftr"></div>
<dialog id="dlg" aria-label="Detay"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:1rem;text-align:center">Bu sayfanın çalışması için JavaScript gerekir.</p></noscript>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
